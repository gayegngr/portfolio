<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Gaye Güngör</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #111111; opacity: 0; transition: opacity 0.6s ease-in-out; }
        body.loaded { opacity: 1; }
        body.fade-out { opacity: 0; }
        body.lang-tr .en-text { display: none !important; }
        body.lang-en .tr-text { display: none !important; }

        .hero { height: 60vh; background-color: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hero h1 { color: #ffffff; font-size: clamp(3rem, 5vw, 5rem); font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; animation: slideUp 1.5s ease-out forwards; opacity: 0; transform: translateY(30px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .nav-container { position: sticky; top: 0; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); padding: 20px 0; border-bottom: 1px solid #eaeaea; z-index: 1000; text-align: center; }
        .nav-links { list-style: none; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: #888888; font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s ease; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #111111; }

        .content-section { padding: 80px 10%; min-height: 100vh; max-width: 1200px; margin: 0 auto; }
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 50px; }
        .bio-text p { font-size: 1.1rem; line-height: 1.8; margin-bottom: 25px; color: #444; text-align: justify; }
        
        .profile-img-container { width: 100%; aspect-ratio: 3/4; background-color: #e0e0e0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .contact-box { margin-top: 40px; padding-top: 30px; border-top: 1px solid #eaeaea; display: flex; flex-direction: column; gap: 20px; }
        .contact-item span { display: block; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
        .contact-item a, .contact-item .info-text { color: #111; text-decoration: none; font-size: 1.1rem; }
        
        footer { padding: 40px 10%; text-align: center; border-top: 1px solid #eaeaea; font-size: 0.85rem; color: #888888; background-color: #ffffff; }
    </style>
</head>
<body class="lang-en">
<!-- Tüm dosyalarda aynı olmalı (Sıralama: About, Projects, Education, Software) -->
<nav class="nav-container" id="navbar">
    <ul class="nav-links" style="list-style: none; padding: 0;">
        <li><a href="about.html" class="[ABOUT_ACTIVE]" onclick="transitionToPage(event, 'about.html')">About</a></li>
        <li><a href="projects.html" class="[PROJECTS_ACTIVE]" onclick="transitionToPage(event, 'projects.html')">Projects</a></li>
        <li><a href="education.html" class="[EDUCATION_ACTIVE]" onclick="transitionToPage(event, 'education.html')">Education</a></li>
        <li><a href="software.html" class="[SOFTWARE_ACTIVE]" onclick="transitionToPage(event, 'software.html')">Software</a></li>
    </ul>
</nav>
    <section class="content-section">
        <div class="about-grid">
            <div class="bio-text">
                <!-- Buraya Biyografin gelecek -->
            </div>
            <div class="profile-side">
                <div class="profile-img-container"><img src="WhatsApp Image 2026-07-21 at 14.27.58.jpeg" alt="Gaye Güngör"></div>
                <div class="contact-box">
                    <!-- İletişim bilgilerin burada -->
                </div>
            </div>
        </div>
    </section>
    <script> /* Dil ve Geçiş scriptleri */ </script>
</body>
</html>
