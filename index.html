<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaye Güngör | Architectural Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #111111; opacity: 0; transition: opacity 0.6s ease-in-out; }
        body.loaded { opacity: 1; }
        body.fade-out { opacity: 0; }
        body.lang-tr .en-text { display: none !important; }
        body.lang-en .tr-text { display: none !important; }

        .fixed-logo { position: fixed; top: 30px; left: 40px; color: #ffffff; font-size: 1rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.15em; text-decoration: none; z-index: 9999; mix-blend-mode: difference; transition: opacity 0.3s ease; }
        .lang-toggle { position: fixed; top: 30px; right: 40px; color: #ffffff; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; z-index: 9999; mix-blend-mode: difference; }

        .hero { height: 100vh; background-color: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .hero h1 { color: #ffffff; font-size: clamp(3rem, 6vw, 6rem); font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; animation: slideUp 1.5s ease-out forwards; opacity: 0; transform: translateY(30px); text-align: center; }
        .hero p { color: #888888; margin-top: 20px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.2em; animation: slideUp 1.5s ease-out forwards 0.3s; opacity: 0; transform: translateY(30px); text-align: center; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .hero-social, .hero-contact { position: absolute; bottom: 40px; display: flex; flex-direction: column; gap: 8px; }
        .hero-social { left: 50px; } .hero-contact { right: 50px; text-align: right; }
        .contact-link { color: #666666; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; }

        .nav-container { position: sticky; top: 0; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); padding: 20px 0; border-bottom: 1px solid #eaeaea; z-index: 1000; text-align: center; }
        .nav-links { list-style: none; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: #888888; font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s ease; cursor: pointer; }
        .nav-links a:hover { color: #111111; }

        .philosophy-section { padding: 150px 10%; background-color: #ffffff; text-align: center; min-height: 60vh; border-bottom: 1px solid #eaeaea; }
        .philosophy-text { font-size: clamp(1.5rem, 2.5vw, 2.5rem); font-weight: 300; line-height: 1.6; max-width: 1000px; margin: 0 auto; }
        .philosophy-sub { margin-top: 30px; font-size: 0.9rem; color: #888888; text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
</head>
<body class="lang-en">
    <a href="index.html" class="fixed-logo">Home</a>
    <div class="lang-toggle" onclick="toggleLanguage()">EN / TR</div>
    <section class="hero">
        <h1>Gaye Güngör</h1>
        <p>Architectural Designer</p>
    </section>
    <nav class="nav-container" id="navbar">
        <ul class="nav-links">
            <li><a href="about.html" onclick="transitionToPage(event, 'about.html')">About</a></li>
            <li><a href="projects.html" onclick="transitionToPage(event, 'projects.html')">Projects</a></li>
            <li><a href="education.html" onclick="transitionToPage(event, 'education.html')">Education</a></li>
            <li><a href="software.html" onclick="transitionToPage(event, 'software.html')">Software</a></li>
        </ul>
    </nav>
    <section class="philosophy-section">
        <div class="philosophy-text">Exploring the intersection of structural resilience and human experience.</div>
        <div class="philosophy-sub">— Design Philosophy</div>
    </section>
    <script>
        window.onload = () => document.body.classList.add('loaded');
        function transitionToPage(e, url) { e.preventDefault(); document.body.classList.add('fade-out'); setTimeout(() => window.location.href = url, 600); }
        function toggleLanguage() { /* Dil değiştirme kodun */ }
    </script>
</body>
</html>
